<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account Â· AURA++</title>
  <link rel="stylesheet" href="css/design-system.css?v=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--cream);
      background-image:
        radial-gradient(circle at 20% 15%, rgba(184, 176, 212, 0.35), transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(168, 197, 224, 0.3), transparent 55%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 48px 44px;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 40px 100px rgba(23, 23, 23, 0.12),
        0 0 0 1px rgba(23, 23, 23, 0.04) inset;
      position: relative;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--charcoal);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-style: italic;
    }

    .brand-name {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: 38px;
      letter-spacing: -1.5px;
      line-height: 1.05;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    label i { color: var(--text-muted); margin-right: 6px; }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--charcoal);
      box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.08);
    }

    input::placeholder { color: #a8a0a0; }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 15px;
      opacity: 0.6;
    }
    .pw-toggle:hover { opacity: 1; }

    .btn-primary {
      width: 100%;
      background: var(--charcoal);
      color: var(--cream);
      padding: 16px;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: #2a2a2a;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(23, 23, 23, 0.2);
    }

    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .foot {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 22px;
    }

    .foot a {
      color: var(--text-main);
      font-weight: 700;
      text-decoration: none;
    }
    .foot a:hover { text-decoration: underline; }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
    }
    .msg.error { background: rgba(199, 58, 58, 0.08); color: var(--error); border: 1px solid rgba(199, 58, 58, 0.25); display: block; }
    .msg.success { background: rgba(79, 140, 92, 0.08); color: var(--success); border: 1px solid rgba(79, 140, 92, 0.25); display: block; }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .back-link:hover { color: var(--text-main); }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin: 4px 0 14px;
      line-height: 1.5;
    }
    .terms input { width: auto; margin-top: 2px; flex-shrink: 0; }
    .terms a { color: var(--text-main); font-weight: 600; text-decoration: none; }
    .terms a:hover { text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="css/interactions.css?v=1.1">
</head>
<body>

  <div class="card">
    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back
    </a>

    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">AURA++ Â· TICKETING PLATFORM</div>
    </div>

    <h1>Create Account</h1>
    <p class="sub">Join AURA++ â€” free, no credit card needed</p>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>

    <form id="register-form">
      <div class="field">
        <label for="fullname"><i class="fa-solid fa-user"></i> Full Name</label>
        <input type="text" id="fullname" placeholder="Your full name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 01700000000" required autocomplete="tel">
      </div>

      <div class="field">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Create a strong password" required autocomplete="new-password">
          <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" onclick="togglePw('password', this)">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirm"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm" placeholder="Re-enter your password" required autocomplete="new-password">
          <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" onclick="togglePw('confirm', this)">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms" required>
        <span>I agree to the <a href="javascript:void(0)">Terms of Service</a> and <a href="javascript:void(0)">Privacy Policy</a>.</span>
      </label>

      <button type="submit" class="btn-primary" id="submit-btn">
        <i class="fa-solid fa-user-plus"></i>
        <span>Create Account</span>
      </button>
    </form>

    <p class="foot">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>

  <script>
    /* ---------- register page controller ---------- */
    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    function togglePw(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.querySelector('i').className = 'fa-solid fa-eye-slash';
        btn.setAttribute('aria-label', 'Hide password');
        btn.setAttribute('aria-pressed', 'true');
      } else {
        input.type = 'password';
        btn.querySelector('i').className = 'fa-solid fa-eye';
        btn.setAttribute('aria-label', 'Show password');
        btn.setAttribute('aria-pressed', 'false');
      }
    }

    function redirectToSite(user) {
      localStorage.setItem('aura_user', JSON.stringify(user));
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const terms = document.getElementById('terms').checked;

      if (!fullName || !email || !phone || !password || !confirm) {
        showMessage('Please fill in every field.', 'error');
        return;
      }

      if (!terms) {
        showMessage('Please agree to the Terms of Service.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters.', 'error');
        return;
      }

      if (password !== confirm) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Creating account...</span>';

      let user = null;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, phone, password })
        });

        const data = await res.json();

        if (res.ok && data.user) {
          user = data.user;
          showMessage('Account created! Redirecting...', 'success');
          redirectToSite(user);
          return;
        } else {
          showMessage(data.message || 'Registration failed. Try a different email.', 'error');
        }
      } catch (err) {
        console.warn('[register] API unavailable:', err);
        showMessage('AURA could not reach the registration service. Check your connection and try again.', 'error');
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> <span>Create Account</span>';
    });
  </script>
</body>
</html>
