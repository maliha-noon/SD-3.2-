<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · AURA++</title>
  <link rel="stylesheet" href="css/design-system.css?v=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--cream);
      background-image:
        radial-gradient(circle at 20% 15%, rgba(184, 176, 212, 0.35), transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(168, 197, 224, 0.3), transparent 55%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 48px 44px;
      max-width: 460px;
      width: 100%;
      box-shadow:
        0 40px 100px rgba(23, 23, 23, 0.12),
        0 0 0 1px rgba(23, 23, 23, 0.04) inset;
      position: relative;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-mark {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--charcoal);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-style: italic;
    }

    .brand-name {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: 40px;
      letter-spacing: -1.5px;
      line-height: 1.05;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--charcoal);
      box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.08);
    }

    input::placeholder { color: #a8a0a0; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .row label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 500; }
    .row input[type="checkbox"] { width: auto; }
    .row a { color: var(--text-main); font-weight: 600; text-decoration: none; }
    .row a:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      background: var(--charcoal);
      color: var(--cream);
      padding: 16px;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: #2a2a2a;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(23, 23, 23, 0.2);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-card);
    }

    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #111;
      padding: 14px;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: 1.5px solid var(--border-card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-google:hover { background: #f8f8f8; }

    .foot {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 24px;
    }

    .foot a {
      color: var(--text-main);
      font-weight: 700;
      text-decoration: none;
    }
    .foot a:hover { text-decoration: underline; }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
    }
    .msg.error { background: rgba(199, 58, 58, 0.08); color: var(--error); border: 1px solid rgba(199, 58, 58, 0.25); display: block; }
    .msg.success { background: rgba(79, 140, 92, 0.08); color: #4f8c5c; border: 1px solid rgba(79, 140, 92, 0.25); display: block; }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .back-link:hover { color: var(--text-main); }
  </style>
  <link rel="stylesheet" href="css/interactions.css?v=1.1">
</head>
<body>

  <div class="card">
    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back
    </a>

    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">AURA++ · TICKETING PLATFORM</div>
    </div>

    <h1>Welcome Back</h1>
    <p class="sub">Sign in to continue to AURA++</p>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <div class="row">
        <label><input type="checkbox"> Remember me</label>
        <a href="javascript:void(0)" onclick="alert('Password recovery is not available yet. Please contact support.')">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Login</span>
      </button>
    </form>

    <div class="divider">OR</div>

      <button type="button" class="btn-google" onclick="handleGoogleLogin()">
      <i class="fa-brands fa-google" style="color:#4285f4;"></i>
      Login with Google
    </button>

    <p class="foot">
      Don't have an account? <a href="register.html">Create Account</a>
    </p>
  </div>

  <script>
    /* ---------- login page controller ---------- */
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    function redirectToSite(user) {
      // Save the user so index.html knows they're logged in
      localStorage.setItem('aura_user', JSON.stringify(user));
      // Short delay so success message is visible
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Please fill in both email and password.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Signing in...</span>';

      let user = null;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.user) {
          user = data.user;
          showMessage('Login successful! Redirecting...', 'success');
          redirectToSite(user);
          return;
        } else {
          showMessage(data.message || 'Login failed. Check your email and password.', 'error');
        }
      } catch (err) {
        console.warn('[login] API unavailable:', err);
        showMessage('AURA could not reach the sign-in service. Check your connection and try again.', 'error');
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Login</span>';
    });

    function handleGoogleLogin() {
      showMessage('Google sign in is not connected yet.', 'error');
    }
  </script>
</body>
</html>
