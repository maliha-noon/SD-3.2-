version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_web_app
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Database=aura_db;User=root;Password=rootpassword;
      - ConnectionStrings__SqliteConnection=Data Source=/app/aura.db
    depends_on:
      - mysql_db
    restart: always

  mysql_db:
    image: mysql:8.0
    container_name: aura_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aura_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
